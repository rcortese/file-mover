name: Run Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -v
